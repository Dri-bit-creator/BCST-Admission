<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Upload Documents</title>
    <link rel="stylesheet" href="/bcst/assets/css/apply.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}</style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-10">

      <button onclick="history.back()" class="mb-6 flex items-center text-green-600 hover:text-green-800 transition-all">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
        Back To Enrollment Step 1
      </button>

      <div class="bg-white shadow-md rounded-lg p-8">
        <h2 class="text-3xl font-bold text-green-700 mb-6">Enrollment Form - Step 2: Upload Documents</h2>

        <!-- Firebase SDKs -->
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
        <script src="firebase-config.js"></script>

        <form id="uploadForm" class="" enctype="multipart/form-data">
          <div class="mb-6">
            <label class="block font-medium text-gray-700 mb-1">Application ID</label>
            <input id="appId" type="text" readonly class="block w-full border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-700 focus:ring-2 focus:ring-green-400 focus:outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
              <label class="block font-medium text-gray-700 mb-1">Report Card</label>
              <input id="card_id" type="file" name="card_id" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <div>
              <label class="block font-medium text-gray-700 mb-1">Birth Certificate</label>
              <input id="birth_cert" type="file" name="birth_cert" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <div>
              <label class="block font-medium text-gray-700 mb-1">Good Moral Certificate</label>
              <input id="good_moral" type="file" name="good_moral" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <div>
              <label class="block font-medium text-gray-700 mb-1">NSO/PSA</label>
              <input id="nso_psa" type="file" name="nso_psa" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <div>
              <label class="block font-medium text-gray-700 mb-1">Formal Picture</label>
              <input id="formal_picture" type="file" name="formal_picture" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <div>
              <label class="block font-medium text-gray-700 mb-1">Diploma</label>
              <input id="diploma" type="file" name="diploma" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>

            <div class="sm:col-span-2">
              <label class="block font-medium text-gray-700 mb-1">Form 137</label>
              <input id="form_137" type="file" name="form_137" class="block w-full border border-gray-300 rounded px-3 py-2 bg-white focus:ring-2 focus:ring-green-400 focus:outline-none">
            </div>
          </div>

          <div class="mt-8">
            <button id="submitBtn" type="submit" class="w-full md:w-auto bg-green-600 text-white px-6 py-3 rounded-md font-semibold hover:bg-green-700 transition-all">Submit Enrollment</button>
          </div>
        </form>
        <div id="status" class="mt-4 text-sm text-gray-600"></div>
      </div>
    </div>

    <script>
      const { db, storage } = window.fb || {};

      function q(name) {
        return new URLSearchParams(location.search).get(name);
      }

      async function init() {
        if (!db || !storage) return document.getElementById('status').textContent = 'Firebase not configured.';

        const studentId = q('student_id');
        if (!studentId) return alert('Missing student_id');
        document.getElementById('appId').value = studentId;

        // find student doc
        const snap = await db.collection('students').where('student_id','==', studentId).limit(1).get();
        if (snap.empty) return alert('Application not found.');
        const doc = snap.docs[0];
        const docId = doc.id;

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = document.getElementById('submitBtn');
          btn.disabled = true; btn.innerText = 'Uploading...';
          const filesMap = {
            card_id: 'report_card_file',
            birth_cert: 'birth_cert_file',
            good_moral: 'good_moral_file',
            nso_psa: 'nso_psa_file',
            formal_picture: 'formal_picture_file',
            diploma: 'diploma_file',
            form_137: 'form_137_file'
          };

          const updates = {};
          for (const inputName in filesMap) {
            const input = document.getElementById(inputName);
            if (input && input.files && input.files[0]) {
              const file = input.files[0];
              const path = `students/${studentId}/${inputName}_${Date.now()}_${file.name}`;
              try {
                const ref = storage.ref(path);
                const task = await ref.put(file);
                const url = await ref.getDownloadURL();
                updates[filesMap[inputName]] = url;
              } catch (err) {
                console.error('Upload failed for', inputName, err);
                alert('Upload failed for ' + inputName + ': ' + (err.message || err));
                btn.disabled = false; btn.innerText = 'Submit Enrollment';
                return;
              }
            }
          }

          updates.uploaded_at = firebase.firestore.FieldValue.serverTimestamp();
          updates.approved = 0;

          try {
            await db.collection('students').doc(docId).update(updates);
            window.location.href = `submit_student.php?student_id=${encodeURIComponent(studentId)}`;
          } catch (err) {
            console.error(err);
            alert('Failed to update application: ' + (err.message || err));
            btn.disabled = false; btn.innerText = 'Submit Enrollment';
          }
        });
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
