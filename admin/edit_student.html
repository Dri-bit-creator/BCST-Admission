<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Edit Student</title>
        <link rel="stylesheet" href="/bcst/assets/css/apply.css">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50">
        <div class="max-w-4xl mx-auto p-6 bg-white rounded shadow mt-12">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-3xl font-bold">Edit Student Record</h2>
                    <p class="text-sm text-gray-600">Update student information below</p>
                </div>
                <a href="dashboard.php" class="text-blue-600">Back to Dashboard</a>
            </div>

            <form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Student ID</label>
                    <input id="student_id" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" required />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Enrollment Date</label>
                    <input id="enrollment_date" type="date" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input id="full_name" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Gender</label>
                    <select id="gender" class="mt-1 block w-full rounded border-gray-300 px-3 py-2"><option value="">Select</option><option>Male</option><option>Female</option></select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Date of Birth</label>
                    <input id="date_of_birth" type="date" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Place of Birth</label>
                    <input id="place_of_birth" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Father's Name</label>
                    <input id="fathers_name" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mother's Name</label>
                    <input id="mothers_name" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contact Number</label>
                    <input id="contact_no" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Religion</label>
                    <input id="religion" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">School Level</label>
                    <input id="school_level" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input id="email" type="email" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
                </div>

                <div class="md:col-span-2 flex justify-end gap-4 mt-4">
                    <a href="dashboard.php" class="px-4 py-2 bg-gray-300 rounded">Cancel</a>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Update Record</button>
                </div>
            </form>
        </div>

        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
        <script src="firebase-config.js"></script>
        <script>
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) location.href = 'dashboard.php';

            const { db, auth } = window.fb || {};
            auth && auth.onAuthStateChanged(user => { if(!user) location.href='admin.php'; });

            (async function(){
                
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                if (!id) { alert('No id'); location.href='dashboard.php'; }

                async function load() {
                    const doc = await db.collection('students').doc(id).get();
                    if (!doc.exists) { alert('Not found'); location.href='dashboard.php'; }
                    const data = doc.data();
                    document.getElementById('enrollment_date').value = data.enrollment_date ? new Date(data.enrollment_date).toISOString().slice(0,10) : '';
                    document.getElementById('student_id').value = data.student_id || '';
                    document.getElementById('full_name').value = data.full_name || '';
                    document.getElementById('gender').value = data.gender || '';
                    document.getElementById('dob').value = data.date_of_birth || '';
                    document.getElementById('pob').value = data.place_of_birth || '';
                    document.getElementById('fathers_name').value = data.fathers_name || '';
                    document.getElementById('contact_no').value = data.contact_no || '';
                    document.getElementById('mothers_name').value = data.mothers_name || '';
                    document.getElementById('religion').value = data.religion || '';
                    document.getElementById('school_level').value = data.school_level || '';
                    document.getElementById('email').value = data.email || '';
                }

                document.getElementById('editForm').addEventListener('submit', async (e)=>{
                    e.preventDefault();
                    const updates = {
                        enrollment_date: document.getElementById('enrollment_date').value,
                        student_id: document.getElementById('student_id').value.trim(),
                        full_name: document.getElementById('full_name').value.trim(),
                        gender: document.getElementById('gender').value,
                        date_of_birth: document.getElementById('dob').value,
                        place_of_birth: document.getElementById('pob').value,
                        fathers_name: document.getElementById('fathers_name').value,
                        contact_no: document.getElementById('contact_no').value,
                        mothers_name: document.getElementById('mothers_name').value,
                        religion: document.getElementById('religion').value,
                        school_level: document.getElementById('school_level').value,
                        email: document.getElementById('email').value.trim()
                    };
                    await db.collection('students').doc(id).update(updates);
                    window.location.href = 'dashboard.php';
                });

                load();
            })();
        </script>
    </body>
</html>
